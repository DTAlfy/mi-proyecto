<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
  :root { --tam: 44px; --ancho: 900px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #f5f5f5; }
  body { font-family: "Segoe UI", system-ui, sans-serif; font-size: var(--tam); line-height: 1.5; }
  #texto { max-width: var(--ancho); margin: 0 auto; padding: 45vh 32px 90vh; }
  body.espejo #texto { transform: scaleX(-1); }
  h1, h2, h3 { color: #ffb703; font-size: .6em; text-transform: uppercase; letter-spacing: .08em; margin: 2.2em 0 .6em; }
  p { margin: 0 0 1.1em; }
  strong { color: #ffffff; background: #333; padding: 0 .15em; }
  .cue { display: inline-block; font-size: .42em; line-height: 1.3; padding: .25em .7em; margin: .2em .2em .2em 0;
         border-radius: 99px; background: #222; color: #9aa4b2; vertical-align: middle; }
  .cue-pantalla { background: #0b3d91; color: #fff; font-size: .55em; font-weight: 700; }
  .cue-tarea, .cue-recurso { background: #1b5e20; color: #fff; }
  .cue-nota { background: #5d4a00; color: #ffe08a; }
  .cue-escena { display: block; width: fit-content; background: #ffb703; color: #000; font-size: .5em; font-weight: 800;
                letter-spacing: .04em; margin: .6em 0; }
  .cue-objetivos { background: #6a1b9a; color: #fff; }
  #guia { position: fixed; top: 45vh; left: 0; right: 0; height: 2px; background: rgba(255,183,3,.35); pointer-events: none; }
  #barra { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 16px; font-size: 14px; background: #111; color: #888;
           display: flex; gap: 16px; flex-wrap: wrap; }
  #barra b { color: #ffb703; }
  body.grabando #barra { opacity: .15; }
</style>
</head>
<body>
<div id="guia"></div>
<main id="texto">{{CUERPO}}</main>
<div id="barra">
  <span><b>{{TITULO}}</b> · ~{{DURACION}} min</span>
  <span><b>Espacio</b> iniciar/pausar</span>
  <span><b>↑/↓</b> velocidad <b id="vel">40</b></span>
  <span><b>+/−</b> tamaño</span>
  <span><b>M</b> espejo</span>
  <span><b>Inicio</b> volver arriba</span>
</div>
<script>
  // Desplazamiento automático: píxeles por segundo ajustables durante la lectura.
  let vel = 40, activo = false, ultimo = null, tam = 44, resto = 0;
  const velEl = document.getElementById("vel");
  function paso(t) {
    if (!activo) { ultimo = null; return; }
    if (ultimo !== null) {
      resto += vel * (t - ultimo) / 1000;
      const px = Math.floor(resto);
      if (px) { window.scrollBy(0, px); resto -= px; }
    }
    ultimo = t;
    requestAnimationFrame(paso);
  }
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); activo = !activo; document.body.classList.toggle("grabando", activo); if (activo) requestAnimationFrame(paso); }
    if (e.key === "ArrowUp") { e.preventDefault(); vel = Math.min(vel + 5, 300); }
    if (e.key === "ArrowDown") { e.preventDefault(); vel = Math.max(vel - 5, 5); }
    if (e.key === "+" || e.key === "=") { tam += 4; document.documentElement.style.setProperty("--tam", tam + "px"); }
    if (e.key === "-") { tam = Math.max(20, tam - 4); document.documentElement.style.setProperty("--tam", tam + "px"); }
    if (e.key.toLowerCase() === "m") document.body.classList.toggle("espejo");
    if (e.key === "Home") window.scrollTo(0, 0);
    velEl.textContent = vel;
  });
</script>
</body>
</html>
