<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPCION}}">
<title>{{TITULO}} · {{MARCA}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Inter:wght@400;500;600;700&display=swap">
<style>
{{CSS}}
:root { --brand: {{PRIMARIO}}; --brand-2: {{SECUNDARIO}}; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="marca" href="{{INICIO}}"><span class="punto" aria-hidden="true"></span><span>{{MARCA}} <small>· {{CURSO_CORTO}}</small></span></a>
    <div class="acciones">
      <button class="btn fantasma mini" type="button" data-tema aria-label="Cambiar tema claro u oscuro"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg> Tema</button>
      <button class="btn fantasma mini solo-escritorio" type="button" onclick="window.print()">Imprimir</button>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap">
    <span class="eyebrow">{{EYEBROW}}</span>
    <h1>{{TITULO_HTML}}</h1>
    <p class="lead">{{LEAD}}</p>
  </section>
  <section class="wrap componente">
    {{CONTENIDO}}
  </section>
</main>

<footer class="pie">
  <div class="wrap">
    <span>© {{AUTOR}} · {{CURSO}}</span>
    <span>{{AVISO}}</span>
  </div>
</footer>
<noscript><p class="wrap nota">Este material es interactivo: activa JavaScript para usarlo.</p></noscript>
{{DATOS}}
<script>
{{JS}}
</script>
</body>
</html>
